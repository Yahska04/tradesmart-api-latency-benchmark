# Nginx virtual host for https://tsolc.tradesmartonline.in
#
# Install as /etc/nginx/sites-available/tsolc.tradesmartonline.in (install.sh copies it there once and never
# overwrites it). The system team then replaces every CHANGE_ME value, enables the site and reloads Nginx.
#
# Code folder: /vns-work/code/tsolc.tradesmartonline.in. It is deliberately NOT a document root: the app runs as a
# service on 127.0.0.1:8501 and Nginx forwards requests to it. Never add a "root" pointing at the code folder,
# or the source code could be downloaded from the website.
#
# Names here are prefixed tsolc_ so they can't clash with other sites on this server.

map $http_upgrade $tsolc_connection_upgrade {
    default upgrade;
    ''      close;
}

# Per client IP. Slows password guessing, while the burst absorbs the many static files of one page.
limit_req_zone $binary_remote_addr zone=tsolc_req:10m rate=10r/s;

server {
    listen 80;
    server_name tsolc.tradesmartonline.in;
    server_tokens off;

    # TradeSmart login return. $args keeps the query string exactly as sent, so ab%2Bc stays encoded.
    location = /callback {
        return 302 https://$host/Settings$is_args$args;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tsolc.tradesmartonline.in;
    server_tokens off;

    # SYSTEM TEAM: company SSL certificate. Use the full chain (server certificate first).
    ssl_certificate     CHANGE_ME_SSL_CERTIFICATE_PATH;
    ssl_certificate_key CHANGE_ME_SSL_PRIVATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # SYSTEM TEAM: office and VPN networks only, one "allow" line each. This app can place live orders.
    # Keep 127.0.0.1: deploy/healthcheck.sh uses it, and the login still applies.
    allow 127.0.0.1/32;
    allow CHANGE_ME_OFFICE_CIDR;
    allow CHANGE_ME_VPN_CIDR;
    deny all;

    client_max_body_size 5m;

    # TradeSmart login return when the registered redirect URL is https. Only redirects.
    location = /callback {
        return 302 https://$host/Settings$is_args$args;
    }

    location / {
        limit_req zone=tsolc_req burst=200 nodelay;
        limit_req_status 429;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/tsbench.htpasswd;

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket: required, or the page shows a connection error.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tsolc_connection_upgrade;

        # Must stay exactly what the browser sent, or the app refuses the WebSocket.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Who is logged in. These replace anything the client sent. Without them the app denies everyone.
        proxy_set_header X-Remote-User $remote_user;
        include /etc/nginx/tsbench-proxy-secret.conf;
        # The app has no use for the password, so it never receives it.
        proxy_set_header Authorization "";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
